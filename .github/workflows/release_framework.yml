# Runs when an Argus release PR is merged into main (head branch release-* /
# prerelease-*): cuts the GitHub release — tag argus-sdk-v<version> plus a
# zipped Argus.xcframework asset (ArgusFramework.zip) for direct download. This
# tag is also what SPM and the CocoaPods podspec resolve against.
#
# By design this repo stores NO secrets: the release is created with the
# built-in, repo-scoped GITHUB_TOKEN. The CocoaPods trunk push (the only step
# that needs a real credential) is a separate MANUAL workflow in the private
# source repo (iOS_deploy_pod.yml), so no third-party secret ever lives here.
name: Release framework

on:
  pull_request:
    types:
      - closed
    branches:
      - 'main'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release_framework:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((startsWith(github.head_ref, 'release') || startsWith(github.head_ref, 'prerelease'))
        && github.event.pull_request.merged == true)
    runs-on: macos-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby and gems
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.2.1"
        bundler-cache: true

    - name: GitHub release
      env:
        # Built-in, ephemeral, repo-scoped token — nothing stored in this repo.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bundle exec fastlane release_argus_sdk
